name: image-local-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate the local-only image definition
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: jspark3-local:1.0.0
          build-args: |
            JSPARK3_VERSION=1.0.0
            JSPARK3_SOURCE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
