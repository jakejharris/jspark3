<svg viewBox="0 0 720 660" role="img" aria-labelledby="jsv-cluster-title jsv-cluster-desc"><title id="jsv-cluster-title">Three Sparks. One model.</title><desc id="jsv-cluster-desc">Three champagne-gold DGX Sparks with metal-foam faces, wired as a switchless ring: each Spark cables both of its rear QSFP ports, one to each of the other two. The two workers face forward; Rank 0 is turned round to show its rear panel and the two cables in it. Token pulses illustrate shared fabric activity, not live telemetry or sequential model execution. Rank zero exposes the API; all three machines participate in tensor-parallel execution.</desc><defs><linearGradient id="jsv-spark-top" x1=".1" y1="0" x2=".65" y2="1"><stop stop-color="#dccaa5"></stop><stop offset=".55" stop-color="#c6b18b"></stop><stop offset="1" stop-color="#a99470"></stop></linearGradient><linearGradient id="jsv-spark-side" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#8b7858"></stop><stop offset=".55" stop-color="#ae9a76"></stop><stop offset="1" stop-color="#c9b590"></stop></linearGradient><linearGradient id="jsv-spark-foam" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#c0ac86"></stop><stop offset=".5" stop-color="#a38e68"></stop><stop offset="1" stop-color="#b39d76"></stop></linearGradient><linearGradient id="jsv-spark-wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8d7b2"></stop><stop offset="1" stop-color="#b9a47e"></stop></linearGradient><linearGradient id="jsv-spark-plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1e3c3"></stop><stop offset=".5" stop-color="#d9c49b"></stop><stop offset="1" stop-color="#ae976d"></stop></linearGradient><linearGradient id="jsv-spark-slot" x1="0" y1="0" x2=".35" y2="1"><stop stop-color="#5f5445"></stop><stop offset=".6" stop-color="#968870"></stop><stop offset="1" stop-color="#cfc0a0"></stop></linearGradient><linearGradient id="jsv-spark-io" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d4c29c"></stop><stop offset="1" stop-color="#b09c77"></stop></linearGradient><ra