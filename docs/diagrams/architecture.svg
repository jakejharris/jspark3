<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" role="img" aria-labelledby="js3-arch-title">
  <title id="js3-arch-title">JSpark3 v1 architecture: one GLM-5.3 Flash endpoint across three DGX Sparks</title>
  <defs>
    <marker id="js3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .a-node { fill: #f8fafc; stroke: #0f172a; stroke-width: 1.5; }
      .a-ctl { fill: #f1f5f9; stroke: #0f172a; stroke-width: 1.5; }
      .a-client { fill: #ecfeff; stroke: #155e75; stroke-width: 1.5; }
      .a-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .a-sub { fill: #334155; }
      .a-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #0f172a; }
      .a-fab { stroke: #b45309; stroke-width: 3; fill: none; }
      .a-mgmt { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
      .a-box { fill: #fff7ed; stroke: #b45309; stroke-width: 1; }
      .a-lbl { font-size: 11px; fill: #7c2d12; font-weight: 600; }
      .a-legend { fill: #334155; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <text x="24" y="34" class="a-title" font-size="19">JSpark3 v1: one GLM-5.3 Flash endpoint across three NVIDIA DGX Sparks</text>
  <text x="24" y="56" class="a-sub" font-size="12">TP 3 · EP 3 · EXL3/TR3 4-bpw target · DFlash2 k=7 draft · FP8 KV cache · 1,000,000-token configured context</text>

  <!-- client -->
  <rect x="24" y="96" width="190" height="96" rx="10" class="a-client"/>
  <text x="40" y="120" class="a-title">Client</text>
  <text x="40" y="140" class="a-sub">OpenAI-compatible HTTP</text>
  <text x="40" y="160" class="a-mono">POST /v1/chat/completions</text>
  <text x="40" y="178" class="a-mono">model: glm-5.3-flash</text>
  <text x="250" y="128" class="a-legend" font-size="10.5" text-anchor="middle">HTTP :8000</text>
  <text x="250" y="140" class="a-legend" font-size="10.5" text-anchor="middle">rank 0 only</text>
  <line x1="214" y1="152" x2="286" y2="152" class="a-mgmt" marker-end="url(#js3-arrow)"/>

  <!-- rank 0 -->
  <rect x="290" y="96" width="340" height="152" rx="10" class="a-node"/>
  <text x="306" y="120" class="a-title">DGX Spark · rank 0 · API head</text>
  <text x="306" y="140" class="a-sub">GB10 (SM 12.1), aarch64 · vLLM mp worker</text>
  <text x="306" y="158" class="a-sub">TP 1/3: attention, KDA, shared expert,</text>
  <text x="306" y="176" class="a-sub">LM head · EP: 96 of 288 routed experts</text>
  <text x="306" y="194" class="a-sub">DFlash2 draft, TP 3 · FP8 KV · prefix cache</text>
  <text x="306" y="212" class="a-sub">64 GiB cgroup · CUDA graphs 8/16/24/32/48</text>
  <text x="306" y="232" class="a-mono">W8A16 overlay: 169 modules / 225 tensors</text>

  <!-- control and identity -->
  <rect x="650" y="96" width="326" height="152" rx="10" class="a-ctl"/>
  <text x="666" y="120" class="a-title">Control and identity</text>
  <text x="666" y="140" class="a-sub">Management LAN: SSH, Gloo/TP sockets, API</text>
  <text x="666" y="158" class="a-sub">Per-rank preflight: GID, MTU, routes, image</text>
  <text x="666" y="176" class="a-sub">digest, checkpoint bytes, manifest, memory</text>
  <text x="666" y="194" class="a-sub">Start order 2 → 1 → 0 · hash-bound manifest</text>
  <text x="666" y="212" class="a-sub">Refuses cgroup, NCCL, overlay, loader drift</text>
  <text x="666" y="232" class="a-sub">Verify: shards, graphs, focused witness</text>
  <line x1="630" y1="172" x2="650" y2="172" class="a-mgmt"/>

  <!-- rank 1 -->
  <rect x="60" y="330" width="340" height="136" rx="10" class="a-node"/>
  <text x="76" y="354" class="a-title">DGX Spark · rank 1 · headless</text>
  <text x="76" y="374" class="a-sub">GB10 (SM 12.1), aarch64 · vLLM mp worker</text>
  <text x="76" y="392" class="a-sub">TP shard 2/3 · EP: 96 of 288 routed experts</text>
  <text x="76" y="410" class="a-sub">DFlash2 draft, TP 3 · FP8 KV · prefix cache</text>
  <text x="76" y="428" class="a-sub">64 GiB cgroup · CUDA graphs 8/16/24/32/48</text>
  <text x="76" y="448" class="a-mono">same overlay, same hash-gated transforms</text>

  <!-- rank 2 -->
  <rect x="600" y="330" width="340" height="136" rx="10" class="a-node"/>
  <text x="616" y="354" class="a-title">DGX Spark · rank 2 · headless</text>
  <text x="616" y="374" class="a-sub">GB10 (SM 12.1), aarch64 · vLLM mp worker</text>
  <text x="616" y="392" class="a-sub">TP shard 3/3 · EP: 96 of 288 routed experts</text>
  <text x="616" y="410" class="a-sub">DFlash2 draft, TP 3 · FP8 KV · prefix cache</text>
  <text x="616" y="428" class="a-sub">64 GiB cgroup · CUDA graphs 8/16/24/32/48</text>
  <text x="616" y="448" class="a-mono">same overlay, same hash-gated transforms</text>

  <!-- fabric triangle: three RoCE-v2 legs, each its own network -->
  <line x1="380" y1="248" x2="230" y2="330" class="a-fab"/>
  <line x1="540" y1="248" x2="770" y2="330" class="a-fab"/>
  <line x1="400" y1="398" x2="600" y2="398" class="a-fab"/>
  <rect x="220" y="278" width="170" height="22" rx="5" class="a-box"/>
  <text x="305" y="293" class="a-lbl" text-anchor="middle">leg A · rank 0 ⇄ rank 1</text>
  <rect x="570" y="278" width="170" height="22" rx="5" class="a-box"/>
  <text x="655" y="293" class="a-lbl" text-anchor="middle">leg B · rank 0 ⇄ rank 2</text>
  <rect x="415" y="408" width="170" height="22" rx="5" class="a-box"/>
  <text x="500" y="423" class="a-lbl" text-anchor="middle">leg C · rank 1 ⇄ rank 2</text>

  <!-- legend -->
  <rect x="24" y="496" width="952" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="518" class="a-legend" font-weight="700" font-size="12">Reading the diagram</text>
  <text x="40" y="538" class="a-legend">Orange lines: three RoCE-v2 fabric legs, each on its own network at MTU 9000; every Spark owns two. Dashed: management.</text>
  <text x="40" y="556" class="a-legend">Model bytes are never inside the image or the recipe; each rank bind-mounts the pinned checkpoint read-only.</text>
  <text x="40" y="574" class="a-legend">Every serving byte is validated before start. W8A16 converts the BF16 trunk to INT8 Marlin at load; experts stay EXL3,</text>
  <text x="40" y="592" class="a-legend">the 34 KDA f/g modules are excluded. The DFlash2 draft is built over all three ranks (draft TP 1 in the profile is ignored).</text>
</svg>
